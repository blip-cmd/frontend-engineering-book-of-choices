name: Calculator or CLI
description: A recommendation you disagree with, a bug, or an idea for the calculator or CLI.
labels: ["tooling"]
body:
  - type: input
    id: link
    attributes:
      label: Calculator link
      description: Use "Copy link to these answers" on the calculator page so we can see your inputs.
  - type: textarea
    id: details
    attributes:
      label: What happened, and what would you expect?
    validations:
      required: true
