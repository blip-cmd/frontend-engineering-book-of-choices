name: Compile and Release Book Assets

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-package:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Set up Pandoc (Markdown to Typst for the PDF)
        uses: pandoc/actions/setup@v1
        with:
          version: "3.10"

      - name: Set up Typst CLI
        uses: typst-community/setup-typst@v5

      - name: Assemble Typst Master Document and EPUB Package
        run: |
          python pipelines/scripts/build_typst_book.py
          python pipelines/scripts/build_epub_book.py

      - name: Compile PDF with Typst
        run: |
          typst compile book/dist/frontend_engineering_book_of_choices.typ book/dist/Frontend_Engineering_as_a_Book_of_Choices.pdf

      - name: Upload Digital Book Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: book-digital-distribution
          path: |
            book/dist/Frontend_Engineering_as_a_Book_of_Choices.pdf
            book/dist/Frontend_Engineering_as_a_Book_of_Choices.epub
            book/dist/frontend_engineering_book_of_choices.typ

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: |
            book/dist/Frontend_Engineering_as_a_Book_of_Choices.pdf
            book/dist/Frontend_Engineering_as_a_Book_of_Choices.epub
            book/dist/frontend_engineering_book_of_choices.typ
          generate_release_notes: true
